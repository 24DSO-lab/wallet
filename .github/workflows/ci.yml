name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Корневой пакет тянет Wails, которому на Linux нужны GTK и WebKit,
          # поэтому полная сборка идёт на Windows, а на Linux проверяется всё
          # остальное.
          - os: windows-latest
            pkgs: ./...
          - os: ubuntu-latest
            pkgs: ./internal/... ./app/...
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod # версия Go одна на всех, задаётся в go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.os == 'windows-latest'
        with:
          node-version: 24
      - run: npm ci
        if: matrix.os == 'windows-latest'
        working-directory: frontend
      - run: npm run build
        if: matrix.os == 'windows-latest'
        working-directory: frontend
      - run: go mod verify
      - run: go build ${{ matrix.pkgs }}
      - run: go vet ${{ matrix.pkgs }}
      - run: go test -race -count=1 ${{ matrix.pkgs }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -version
          govulncheck ${{ matrix.pkgs }}
      - name: Install Wails CLI
        if: matrix.os == 'windows-latest'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build Windows desktop executable
        if: matrix.os == 'windows-latest'
        run: wails build -clean -platform windows/amd64
      - name: Upload Windows smoke-test executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-windows-amd64
          path: build/bin/*.exe
          if-no-files-found: error
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0 # версия, с которой прошёл первый зелёный прогон
          # Линтер собирается текущим Go: готовый бинарник может быть собран
          # более старой версией и отказаться читать go.mod.
          install-mode: goinstall
          args: ./internal/... ./app/...

  # package.json во frontend/ уже есть (заглушка Dev 1), поэтому задача идёт
  # всегда. hashFiles() в условии задания недоступна, только в шагах. Скрипты
  # берутся из package.json: Dev 8 добавляет typecheck (vue-tsc), lint
  # (ESLint), test (Vitest) и build; отсутствующие пропускаются (--if-present).
  frontend:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest may advance ahead of its browser packages.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm test --if-present
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npm run e2e
      - run: npm run build --if-present
