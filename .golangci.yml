version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose  # закрытие тел HTTP-ответов
    - errorlint  # %w и errors.Is/As вместо == и приведения типов
    - gosec      # типичные ошибки безопасности
    - noctx      # HTTP-запросы только с context
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
